plugins {
    id 'com.android.application'
}

// Release signing comes from local.properties (never committed); without it the release APK is unsigned.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.maydings.vibelauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.maydings.vibelauncher'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.1.1'
    }

    signingConfigs {
        release {
            if (localProps.releaseStoreFile) {
                storeFile file(localProps.releaseStoreFile)
                storePassword localProps.releaseStorePassword
                keyAlias localProps.releaseKeyAlias
                keyPassword localProps.releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (localProps.releaseStoreFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'com.google.zxing:core:3.5.3'   // QR code for pasting keys from a phone
}
